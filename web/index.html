<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChocoPy Playground</title>
  <meta name="description" content="Compile and run ChocoPy, a statically typed subset of Python, in your browser. The LLVM-based compiler runs as WebAssembly.">
  <link href="https://fonts.googleapis.com/css?family=Raleway:400,600|Source+Sans+Pro:300,400,400i,700" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <main>
    <h1>ChocoPy Playground</h1>
    <p class="intro">The ChocoPy compiler runs in your browser: it compiles the program to WebAssembly, which is then run here.</p>

    <div class="editor">
      <pre aria-hidden="true"><code id="highlight"></code></pre>
      <textarea id="source" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="ChocoPy source code"># Print the even numbers in a list and add them up

class Counter(object):
    count: int = 0

    def add(self: "Counter", n: int):
        self.count = self.count + n

def is_even(n: int) -&gt; bool:
    return n % 2 == 0

numbers: [int] = None
c: Counter = None
x: int = 0

numbers = [1, 2, 3, 4, 5, 6]
c = Counter()
for x in numbers:
    if is_even(x):
        c.add(x)
        print(x)
print("Sum of evens:")
print(c.count)
</textarea>
    </div>

    <div class="toolbar">
      <button class="btn" id="run">Compile &amp; Run</button>
      <button class="btn btn-outline" id="stop" disabled>Stop</button>
      <span class="hint">Ctrl/⌘ + Enter</span>
      <span id="status">Loading the compiler…</span>
    </div>

    <pre class="output" id="output" aria-live="polite"></pre>
  </main>

  <footer>
    Built with LLVM and lld compiled to WebAssembly.
    Source on <a href="https://github.com/Amila-Rukshan/chocopy">GitHub</a>.
  </footer>

  <script type="module">
    import { createEditor } from "./editor.js";

    const output = document.getElementById("output");
    const status = document.getElementById("status");
    const runButton = document.getElementById("run");
    const stopButton = document.getElementById("stop");

    const editor = createEditor(
      document.getElementById("source"),
      document.getElementById("highlight"),
      { onRun: run });

    function print(text, className) {
      if (className) {
        const span = document.createElement("span");
        span.className = className;
        span.textContent = text;
        output.append(span);
      } else {
        output.append(text);
      }
      output.scrollTop = output.scrollHeight;
    }

    function setRunning(running) {
      runButton.disabled = running;
      stopButton.disabled = !running;
    }

    // Compiling and running happen in a worker; stopping a program that does
    // not end means terminating it, so a new one is started
    let worker;
    function startWorker() {
      worker = new Worker("./worker.js", { type: "module" });
      worker.onmessage = ({ data }) => {
        switch (data.type) {
        case "status":
          status.textContent = data.text;
          break;
        case "output":
          print(data.text);
          break;
        case "compileError":
          status.textContent = "Compilation failed";
          print(data.diagnostics, "error");
          setRunning(false);
          break;
        case "done":
          status.textContent = `Compiled in ${data.compileMs} ms (${data.size} bytes of wasm)`;
          if (data.exitCode !== 0)
            print(`\n[exited with code ${data.exitCode}]`, "note");
          setRunning(false);
          break;
        case "error":
          status.textContent = "Error";
          print(data.text, "error");
          setRunning(false);
          break;
        }
      };
      worker.postMessage({ type: "load" });
    }
    startWorker();

    function run() {
      if (runButton.disabled)
        return;
      output.textContent = "";
      setRunning(true);
      worker.postMessage({ type: "run", source: editor.value, fileName: "program.py" });
    }

    runButton.addEventListener("click", run);
    stopButton.addEventListener("click", () => {
      worker.terminate();
      print("\n[stopped]", "note");
      status.textContent = "Stopped";
      setRunning(false);
      startWorker();
    });
  </script>
</body>
</html>
