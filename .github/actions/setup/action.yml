name: Set up build dependencies
description: Install LLVM 17 (with lld), Ninja and the libraries ChocoPy builds against

runs:
  using: composite
  steps:
    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: brew install llvm@17 ninja

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      shell: bash
      # Same packages as .devcontainer/Dockerfile
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          ninja-build clang-17 llvm-17-dev liblld-17-dev libpolly-17-dev \
          zlib1g-dev libzstd-dev libedit-dev libncurses-dev libcurl4-openssl-dev
        echo "CC=clang-17" >> "$GITHUB_ENV"
        echo "CXX=clang++-17" >> "$GITHUB_ENV"
