name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    name: Build (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-15-intel
            target: macos-x86_64
          - os: macos-15
            target: macos-arm64
    env:
      PACKAGE: chocopy-${{ github.ref_name }}-${{ matrix.target }}

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCHOCOPY_STATIC_LINK=ON

      - name: Build
        run: cmake --build build

      - name: Package
        # chocopyc is self-contained: the package is the binary and the README
        run: |
          cmake --install build --prefix staging --strip
          mkdir "$PACKAGE"
          mv staging/bin/chocopyc "$PACKAGE/"
          cp README.md "$PACKAGE/"

      - name: Smoke test the package
        run: |
          if [ "$RUNNER_OS" = macOS ]; then otool -L "$PACKAGE/chocopyc"; else ldd "$PACKAGE/chocopyc"; fi

          # Compile outside the source tree so only the package is used
          cd "$RUNNER_TEMP"
          cp "$GITHUB_WORKSPACE/testprograms/chocopy_00.py" hello.py
          "$GITHUB_WORKSPACE/$PACKAGE/chocopyc" hello.py
          test "$(./hello)" = "Hello, World!"

      - name: Archive
        # COPYFILE_DISABLE keeps macOS tar from adding AppleDouble files
        run: COPYFILE_DISABLE=1 tar -czf "$PACKAGE.tar.gz" "$PACKAGE"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}
          path: ${{ env.PACKAGE }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    # The wasm compiler package is built by the test workflow
    needs: [test, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      # The compiler packages, not the site's github-pages artifact
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: chocopy-*
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum ./*.tar.gz > SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

  # The playground, built by the test workflow alongside the wasm compiler
  pages:
    name: Deploy the playground
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
