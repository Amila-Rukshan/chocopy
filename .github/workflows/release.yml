name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    name: Build (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-15-intel
            target: macos-x86_64
          - os: macos-15
            target: macos-arm64
    env:
      PACKAGE: chocopy-${{ github.ref_name }}-${{ matrix.target }}

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCHOCOPY_STATIC_LINK=ON

      - name: Build
        run: cmake --build build

      - name: Install
        run: |
          cmake --install build --prefix "$PACKAGE" --strip
          cp README.md "$PACKAGE/"

      - name: Smoke test the package
        run: |
          if [ "$RUNNER_OS" = macOS ]; then otool -L "$PACKAGE/bin/chocopyc"; else ldd "$PACKAGE/bin/chocopyc"; fi

          # Compile outside the source tree so only the package is used
          cd "$RUNNER_TEMP"
          cp "$GITHUB_WORKSPACE/testprograms/chocopy_00.py" hello.py
          "$GITHUB_WORKSPACE/$PACKAGE/bin/chocopyc" hello.py
          test "$(./hello)" = "Hello, World!"

      - name: Archive
        # COPYFILE_DISABLE keeps macOS tar from adding AppleDouble files
        run: COPYFILE_DISABLE=1 tar -czf "$PACKAGE.tar.gz" "$PACKAGE"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}
          path: ${{ env.PACKAGE }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum ./*.tar.gz > SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
