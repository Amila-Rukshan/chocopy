name: Tests

on:
  pull_request:
  push:
    branches: [main]
  # Reused by the release workflow
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux and macOS on x86_64 and arm64
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15]

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DENABLE_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
